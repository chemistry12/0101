<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemy</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Light — graphite ramp, one cobalt accent */
:root {
  --bg:       #f6f6f7;
  --card:     #ffffff;
  --raised:   #f2f2f4;
  --line:     rgba(23,23,23,.08);
  --line2:    rgba(23,23,23,.14);
  --text:     #171717;
  --text2:    #525252;
  --text3:    #737373;
  --accent:   #2563eb;
  --accent-ink:#1d4ed8;
  --accent-bg:#eef3fd;
  --pos:      #16a34a;
  --warn:     #b45309;
  --neg:      #dc2626;
  --neg-bg:   #fdf0f0;
  --sun:      #c2413b;
  --sat:      #2f5fc4;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.08);
  --ease: cubic-bezier(.22,1,.36,1);

  /* 시간표 과목 색 — 바탕/글자 */
  --tt-yellow-bg:#fbf3dc; --tt-yellow:#6b4e0a;
  --tt-green-bg: #e5f3e9; --tt-green: #1f5b33;
  --tt-pink-bg:  #f8e7eb; --tt-pink:  #7a2638;
  --tt-blue-bg:  #e4ecfb; --tt-blue:  #1e429f;
  --tt-purple-bg:#ede9f7; --tt-purple:#45317a;
  --tt-orange-bg:#f9eadd; --tt-orange:#7a3a12;
  --tt-teal-bg:  #e0f2ef; --tt-teal:  #145a52;
}
html.dark {
  --bg:       #141415;
  --card:     #19191b;
  --raised:   #232325;
  --line:     rgba(237,237,237,.08);
  --line2:    rgba(237,237,237,.14);
  --text:     #ededed;
  --text2:    #a1a1a6;
  --text3:    #85858b;
  --accent:   #2f68e6;
  --accent-ink:#8ab0ff;
  --accent-bg:#1a2335;
  --pos:      #4cc38a;
  --warn:     #e0b25a;
  --neg:      #e5484d;
  --neg-bg:   #2a1718;
  --sun:      #e5726d;
  --sat:      #7fa3f0;
  --shadow-sm: none;
  --shadow-lg: 0 8px 24px rgba(0,0,0,.4);

  --tt-yellow-bg:#2c2614; --tt-yellow:#e8cf8a;
  --tt-green-bg: #16281c; --tt-green: #9fd5ae;
  --tt-pink-bg:  #2e1a1f; --tt-pink:  #eeb0bd;
  --tt-blue-bg:  #172238; --tt-blue:  #a7c1f5;
  --tt-purple-bg:#221d33; --tt-purple:#c5b8ec;
  --tt-orange-bg:#2e2016; --tt-orange:#eebf98;
  --tt-teal-bg:  #142926; --tt-teal:  #95d6cc;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
.mono { font-family: 'DM Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex-shrink: 0; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Header ── */
.hdr {
  background: var(--card); border-bottom: 1px solid var(--line);
  height: 56px; padding: 0 24px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  position: sticky; top: 0; z-index: 200;
}
.logo { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 8px; }
.logo-mark {
  width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: #fff;
  font-size: 11px; display: grid; place-items: center; letter-spacing: 0;
}
.hdr-center { display: flex; align-items: baseline; gap: 12px; }
.clock { font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 500; }
.date-txt { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); }
.hdr-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

.icon-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--text2); cursor: pointer;
  display: grid; place-items: center;
  transition: background-color .15s var(--ease), color .15s var(--ease);
}
.icon-btn:hover { background: var(--raised); color: var(--text); }

.sync-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text3); padding: 0 8px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
.sync-pill.synced  .sync-dot { background: var(--pos); }
.sync-pill.syncing .sync-dot { background: var(--warn); }
.sync-pill.error   .sync-dot { background: var(--neg); }
.sync-pill.error   { color: var(--neg); }

.hdr-btn {
  height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line2); background: var(--card); color: var(--text);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background-color .15s var(--ease);
}
.hdr-btn:hover { background: var(--raised); }

/* ── Layout ── */
.wrap { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 1480px; margin: 0 auto; }
.top-row { display: grid; grid-template-columns: 280px 1fr 1fr; gap: 16px; align-items: stretch; }
.bot-row { display: grid; grid-template-columns: 320px 1fr 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 1100px) {
  .bot-row { grid-template-columns: 1fr 1fr 1fr; }
  .todo-card { grid-column: 1 / -1; }
}
@media (max-width: 900px) {
  .top-row, .bot-row { grid-template-columns: 1fr; }
  .wrap { padding: 16px; }
  .hdr { padding: 0 16px; grid-template-columns: auto 1fr; }
  .hdr-center { display: none; }
  .sync-pill span:not(.sync-dot) { display: none; }
}

/* ── Card ── */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow-sm); padding: 20px;
  display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.card-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--text); }
.card-title .ic { color: var(--text3); }
.card-meta { font-size: 12px; color: var(--text3); }

/* ── Calendar ── */
#cal-card { position: relative; overflow: visible; }
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-nav .icon-btn { width: 28px; height: 28px; }
.cal-today-btn {
  height: 28px; padding: 0 8px; border-radius: 6px; border: none; background: transparent;
  font-size: 12px; color: var(--text2); cursor: pointer;
  transition: background-color .15s var(--ease);
}
.cal-today-btn:hover { background: var(--raised); color: var(--text); }
.cal-month { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--text3); padding-bottom: 8px; }
.cal-dow:first-child { color: var(--sun); }
.cal-dow:last-child  { color: var(--sat); }
.cal-day {
  height: 36px; border-radius: 8px; font-size: 13px;
  font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  position: relative; cursor: default;
  transition: background-color .12s var(--ease);
}
.cal-day:hover { background: var(--raised); }
.cal-day.other { color: var(--text3); opacity: .55; }
.cal-day.sun { color: var(--sun); }
.cal-day.sat { color: var(--sat); }
.cal-day.today { background: var(--accent); color: #fff; font-weight: 500; }
.cal-day.today .cal-dot { background: #fff; }
.cal-dots { display: flex; gap: 2px; height: 4px; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; }
.cal-dot.g3     { background: var(--accent); }
.cal-dot.school { background: var(--text3); }
.cal-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text3); margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }

.cal-tooltip {
  position: absolute; z-index: 300;
  background: var(--card); border: 1px solid var(--line2); border-radius: 8px;
  box-shadow: var(--shadow-lg); padding: 12px; min-width: 160px; max-width: 224px;
  font-size: 12px; line-height: 1.6; pointer-events: none;
  animation: rise .18s var(--ease);
}
.cal-tooltip-date { font-family: 'DM Mono', monospace; color: var(--text3); margin-bottom: 4px; }
.cal-tooltip-row { display: flex; align-items: flex-start; gap: 8px; }
.cal-tooltip-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
.cal-tooltip-txt { color: var(--text); word-break: keep-all; }
.cal-tooltip-g3  .cal-tooltip-dot { background: var(--accent); }
.cal-tooltip-sch .cal-tooltip-dot { background: var(--text3); }

/* ── Timetable — 주기율표 칸 ── */
.tt { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; margin: -4px; width: calc(100% + 8px); }
.tt th { font-size: 12px; font-weight: 400; color: var(--text3); padding-bottom: 4px; text-align: center; }
.tt th.th-today { color: var(--accent-ink); font-weight: 500; }
.tt th.p-head { width: 28px; }
.tt td { padding: 0; vertical-align: middle; }
.tt td.p-col { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); text-align: center; }
.tt-row-now td.p-col { color: var(--accent-ink); font-weight: 500; }
.tt-row-now td.p-col span { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: var(--accent-bg); }
.tt-cell {
  height: 40px; padding: 4px 8px; border-radius: 6px;
  display: flex; flex-direction: column; justify-content: center; gap: 0;
  cursor: pointer; position: relative; overflow: hidden;
  transition: filter .12s var(--ease), transform .12s var(--ease);
}
.tt-cell:hover { filter: brightness(.97); }
html.dark .tt-cell:hover { filter: brightness(1.12); }
.tt-cell:active { transform: scale(.98); }
.tt-cell.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.tt-cell.empty:hover { background: var(--raised); }
.tt td.t-col .tt-cell.empty { background: var(--raised); box-shadow: none; }
.tt-row-now td.t-col .tt-cell { box-shadow: inset 0 0 0 1.5px var(--accent); }
.tt-row-now td.t-col .tt-cell.empty { box-shadow: inset 0 0 0 1.5px var(--accent); }
.tt-cell-top  { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; min-width: 0; }
.tt-cell-name { font-size: 12px; font-weight: 500; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-cell-room { font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; line-height: 16px; opacity: .7; flex-shrink: 0; }
.tt-cell-sub  { font-size: 11px; line-height: 14px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Link sections ── */
.link-section-title {
  font-size: 14px; font-weight: 500; color: var(--text);
  border: none; background: transparent; outline: none; font-family: inherit;
  padding: 2px 4px; margin-left: -4px; border-radius: 4px; width: 140px;
  transition: background-color .12s var(--ease);
}
.link-section-title:hover { background: var(--raised); }
.link-section-title:focus { background: var(--accent-bg); }
.link-edit-toggle {
  height: 28px; padding: 0 8px; border-radius: 6px; border: none;
  background: transparent; color: var(--text3); font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background-color .12s var(--ease), color .12s var(--ease);
}
.link-edit-toggle .ic { width: 14px; height: 14px; }
.link-edit-toggle:hover { background: var(--raised); color: var(--text); }
.link-edit-toggle.active { color: var(--accent-ink); background: var(--accent-bg); }

.link-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.link-item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.link-btn {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--raised); color: var(--text);
  font-size: 13px; font-weight: 500; text-align: left; line-height: 18px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
}
.link-btn:hover { background: var(--card); border-color: var(--line2); }
.link-btn:active { transform: scale(.98); }
.link-btn-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
.link-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text3); }

/* 링크 색 = 작은 점 */
.lc-gray   { --dot: #a1a1a6; }
.lc-blue   { --dot: #3b6fe0; }
.lc-green  { --dot: #2f9e5b; }
.lc-yellow { --dot: #d4a017; }
.lc-purple { --dot: #7c5cc4; }
.lc-red    { --dot: #d6474b; }
.lc-teal   { --dot: #1f9e8f; }
.lc-orange { --dot: #e07b2e; }
.link-btn .link-dot, .color-swatch .link-dot { background: var(--dot); }

.link-item-actions { display: none; gap: 4px; }
.edit-mode .link-item-actions { display: flex; }
.link-item-act {
  flex: 1; height: 28px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--text2); font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  transition: background-color .12s var(--ease), color .12s var(--ease);
}
.link-item-act .ic { width: 14px; height: 14px; }
.link-item-act:hover { background: var(--raised); color: var(--text); }
.link-item-act.del:hover { background: var(--neg-bg); color: var(--neg); }

.link-add-btn {
  min-height: 44px; border-radius: 8px; border: 1px dashed var(--line2); background: transparent;
  font-size: 13px; color: var(--text3); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background-color .12s var(--ease), color .12s var(--ease);
}
.link-add-btn:hover { background: var(--raised); color: var(--text); }

.drag-handle { display: flex; justify-content: center; color: var(--text3); cursor: grab; user-select: none; height: 16px; }
.drag-handle:active { cursor: grabbing; }
.link-item.dragging { opacity: .4; }
.link-item.drag-over .link-btn { outline: 1.5px dashed var(--accent); outline-offset: 2px; }

.empty-msg { font-size: 13px; color: var(--text3); text-align: center; padding: 16px 0; }

/* ── Todo ── */
.todo-form { display: flex; flex-direction: column; gap: 8px; }
.todo-input-row { display: flex; gap: 8px; align-items: center; }
.todo-input {
  flex: 1; min-width: 0; height: 36px; padding: 0 12px;
  border: 1px solid var(--line2); border-radius: 8px;
  font-size: 13px; font-family: inherit; background: var(--card); color: var(--text); outline: none;
  transition: border-color .15s var(--ease);
}
.todo-input::placeholder { color: var(--text3); }
.todo-input:focus { border-color: var(--accent); }
.todo-input[type=date] { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); }
html.dark .todo-input[type=date] { color-scheme: dark; }
.todo-due-label { font-size: 12px; color: var(--text3); width: 40px; flex-shrink: 0; }
.todo-add-btn {
  height: 36px; padding: 0 16px; border-radius: 8px; border: none;
  background: var(--text); color: var(--card); font-size: 13px; font-weight: 500;
  cursor: pointer; flex-shrink: 0;
  transition: opacity .15s var(--ease), transform .1s var(--ease);
}
.todo-add-btn:hover { opacity: .88; }
.todo-add-btn:active { transform: scale(.98); }

.todo-list { display: flex; flex-direction: column; }
.todo-item {
  display: flex; align-items: flex-start; gap: 12px; padding: 8px 4px;
  border-bottom: 1px solid var(--line);
}
.todo-item:last-child { border-bottom: none; }
.todo-check {
  width: 16px; height: 16px; margin-top: 2px; border-radius: 4px;
  border: 1.5px solid var(--line2); background: var(--card); color: #fff;
  display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  transition: background-color .12s var(--ease), border-color .12s var(--ease);
}
.todo-check:hover { border-color: var(--accent); }
.todo-check .ic { width: 12px; height: 12px; stroke-width: 2.5; opacity: 0; }
.todo-item.done .todo-check { background: var(--accent); border-color: var(--accent); }
.todo-item.done .todo-check .ic { opacity: 1; }
.todo-text { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; word-break: break-all; }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
.todo-due { font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; font-size: 12px; line-height: 20px; white-space: nowrap; flex-shrink: 0; color: var(--text3); }
.todo-due.due-soon { color: var(--warn); }
.todo-due.due-over { color: var(--neg); }
.todo-item.done .todo-due { color: var(--text3); }
.todo-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity .12s var(--ease); }
.todo-item:hover .todo-actions, .todo-item:focus-within .todo-actions { opacity: 1; }
.todo-act { width: 20px; height: 20px; border-radius: 4px; border: none; background: none; color: var(--text3); cursor: pointer; display: grid; place-items: center; }
.todo-act .ic { width: 14px; height: 14px; }
.todo-act:hover { color: var(--text); background: var(--raised); }
.todo-act.del:hover { color: var(--neg); }
.todo-text-edit {
  flex: 1; font-size: 13px; font-family: inherit; line-height: 20px;
  border: 1px solid var(--accent); border-radius: 4px; padding: 0 8px;
  background: var(--card); color: var(--text); outline: none;
}
.todo-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); }
.todo-count { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); }
.todo-clear-btn { font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color .12s var(--ease), background-color .12s var(--ease); }
.todo-clear-btn:hover { color: var(--neg); background: var(--neg-bg); }

/* ── Buttons ── */
.btn { height: 36px; padding: 0 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s var(--ease); }
.btn:hover { opacity: .9; }
.btn-outline { height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; transition: background-color .15s var(--ease); }
.btn-outline:hover { background: var(--raised); }
.btn-ghost-red { height: 36px; padding: 0 12px; border-radius: 8px; border: none; background: none; color: var(--neg); font-size: 13px; cursor: pointer; transition: background-color .15s var(--ease); }
.btn-ghost-red:hover { background: var(--neg-bg); }

/* ── Overlays ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400; align-items: center; justify-content: center; padding: 16px; }
.overlay.open { display: flex; animation: fade .16s var(--ease); }
.dialog, .mini-dialog {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow-lg); animation: rise .22s var(--ease);
}
.dialog { padding: 24px; width: 480px; max-width: 100%; }
.dialog h2 { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
.dialog p  { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 16px; }
.steps { background: var(--raised); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; counter-reset: s; }
.step { font-size: 13px; color: var(--text2); line-height: 28px; display: flex; gap: 12px; counter-increment: s; }
.step::before { content: counter(s); font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); width: 12px; flex-shrink: 0; }
.step b { color: var(--text); font-weight: 500; }
.url-field { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px; font-size: 13px; font-family: 'DM Mono', monospace; color: var(--text); background: var(--card); outline: none; margin-bottom: 16px; transition: border-color .15s var(--ease); }
.url-field:focus { border-color: var(--accent); }
.dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }

.mini-dialog { padding: 20px; width: 340px; max-width: 100%; display: flex; flex-direction: column; gap: 16px; }
.mini-dialog h3 { font-size: 15px; font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--text2); }
.field input, .field select {
  height: 36px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px;
  font-size: 13px; font-family: inherit; background: var(--card); color: var(--text); outline: none;
  transition: border-color .15s var(--ease);
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.mini-btns { display: flex; gap: 8px; }

.color-picker { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; }
.color-swatch {
  height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--text2); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: border-color .12s var(--ease), background-color .12s var(--ease);
}
.color-swatch:hover { background: var(--raised); }
.color-swatch.selected { border-color: var(--accent); color: var(--text); background: var(--accent-bg); }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
/* ── 아이콘 (lucide) ── */
const ICONS = {
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  table:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  list:'<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  pencil:'<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  plus:'<path d="M5 12h14M12 5v14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  grip:'<circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/>',
};
function ic(n){ return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`; }
document.querySelectorAll('[data-ic]').forEach(e=>e.outerHTML=ic(e.dataset.ic));

/* ── 다크모드 ── */
function setDarkIcon(){ document.getElementById('dark-toggle').innerHTML = ic(document.documentElement.classList.contains('dark') ? 'sun' : 'moon'); }
function toggleDark(){
  const isDark = document.documentElement.classList.toggle('dark');
  try{ localStorage.setItem('dark', isDark ? '1' : '0'); }catch(e){}
  setDarkIcon();
}
try{ if(localStorage.getItem('dark') === '1') document.documentElement.classList.add('dark'); }catch(e){}
setDarkIcon();

/* ── 학년일정 API ── */
const SCHEDULE_API = 'https://script.google.com/macros/s/AKfycbwt88IWEiKk6PZm9Myqcy_i8qSwg6FgtdC8oHa0Q2nGlRstYaSwKz1gryJrDMmKHn-d/exec';
let scheduleMap = {}; // { 'YYYY-MM-DD': { school, g3 } }

async function loadSchedule() {
  try {
    const res  = await fetch(SCHEDULE_API);
    const data = await res.json();
    const rows = data.schedule || data;
    scheduleMap = {};
    rows.forEach(row => {
      const dateVal = row['날짜'];
      if (!dateVal) return;
      const key = String(dateVal).substring(0, 10);
      const school = (row['일정(학교)']    || '').trim();
      const g3     = (row['일정(3학년부)'] || '').trim();
      if (school || g3) scheduleMap[key] = { school, g3 };
    });
    buildCal();
  } catch(e) {}
}

/* ── 시간표 과목 색 (CSS 변수로 라이트/다크 대응) ── */
const COLOR_KEYS = ['yellow','green','purple','blue','pink','orange','teal'];
function ttColor(k){ k = COLOR_KEYS.includes(k) ? k : 'yellow'; return {bg:`var(--tt-${k}-bg)`, text:`var(--tt-${k})`}; }

/* ── 시간표 데이터 ── */
const TT_PRESET = [
  {
    /* 2학기 이상찬 시간표 */
    '화-1':{subject:'실험', sub:'(106)', color:'yellow'},
    '수-1':{subject:'실험', sub:'(102)', color:'yellow'},
    '금-1':{subject:'화학', sub:'(307)', color:'pink'},
    '월-2':{subject:'실험', sub:'(105)', color:'yellow'},
    '수-2':{subject:'실험', sub:'(101)', color:'yellow'},
    '목-2':{subject:'화학', sub:'(301)', color:'pink'},
    '화-3':{subject:'화학', sub:'(307)', color:'pink'},
    '금-3':{subject:'화학', sub:'(301)', color:'pink'},
    '월-4':{subject:'화학2',sub:'(301)', color:'blue'},
    '수-4':{subject:'화학', sub:'(306)', color:'pink'},
    '목-4':{subject:'실험', sub:'(103)', color:'yellow'},
    '금-4':{subject:'화학', sub:'(306)', color:'pink'},
    '월-5':{subject:'실험', sub:'(104)', color:'yellow'},
    '목-6':{subject:'화학', sub:'(307)', color:'pink'},
    '월-7':{subject:'화학', sub:'(306)', color:'purple'},
  },
  {
    /* 2학기 과학탐구실험2 시간표 */
    '화-1':{subject:'실험', sub:'(106) 이상찬T', color:'yellow'},
    '수-1':{subject:'실험', sub:'(102) 이상찬T', color:'yellow'},
    '월-2':{subject:'실험', sub:'(105) 이상찬T', color:'yellow'},
    '화-2':{subject:'실험', sub:'(111) 이서현T', color:'green'},
    '수-2':{subject:'실험', sub:'(101) 이상찬T', color:'yellow'},
    '월-3':{subject:'실험', sub:'(108) 이서현T', color:'green'},
    '목-3':{subject:'실험', sub:'(110) 이서현T', color:'green'},
    '목-4':{subject:'실험', sub:'(103) 이상찬T', color:'yellow'},
    '월-5':{subject:'실험', sub:'(104) 이상찬T', color:'yellow'},
    '월-6':{subject:'실험', sub:'(109) 이서현T', color:'green'},
    '화-6':{subject:'실험', sub:'(107) 이서현T', color:'green'},
  }
];
const DAYS=['월','화','수','목','금'];
const PERIODS=[
  {n:1,t:'08:40'},{n:2,t:'09:40'},{n:3,t:'10:40'},
  {n:4,t:'12:30'},{n:5,t:'13:30'},{n:6,t:'14:30'},{n:7,t:'15:30'},
];

/* ── 상태 ── */
let GS_URL = (()=>{try{return localStorage.getItem('gs_url')||'';}catch(e){return '';}})();
let clsLinks=[], admLinks=[], cls2Links=[];
let userTT = [{},{}];
let todos = [];
let ttTarget = null, calY, calM;

/* ── localStorage ── */
function lsave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lload(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}

/* ── 시계 ── */
function tick(){
  const now=new Date(), p=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent=`${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  const dn=['일','월','화','수','목','금','토'];
  document.getElementById('date-pill').textContent=`${now.getFullYear()}.${p(now.getMonth()+1)}.${p(now.getDate())} ${dn[now.getDay()]}`;
}
setInterval(tick,1000); tick();

/* ── 동기화 ── */
const cloud=()=>!!GS_URL;
function setSync(s){
  const pill=document.getElementById('sync-pill');
  pill.className='sync-pill '+s;
  document.getElementById('sync-txt').textContent={synced:'저장됨',syncing:'저장 중',error:'연결 오류',local:'로컬 모드'}[s];
}

function gsPost(data, cb){
  if(!cloud())return;
  setSync('syncing');
  fetch(GS_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data),
    mode: 'no-cors'
  }).then(()=>{
    setSync('synced');
    if(cb) cb({ok:true});
  }).catch(()=>setSync('error'));
}

function syncData(key, value){
  if(!cloud())return;
  gsPost({action:'set', key, value: JSON.stringify(value)});
}

function loadCloud(){
  if(!cloud())return;
  setSync('syncing');
  fetch(GS_URL+'?action=getAll')
    .then(r=>r.json())
    .then(d=>{
      if(!d||!d.ok){setSync('error');return;}
      const D=d.data||{};
      if(D.clsLinks){ clsLinks=JSON.parse(D.clsLinks); lsave('cls_links',clsLinks); }
      if(D.admLinks){ admLinks=JSON.parse(D.admLinks); lsave('adm_links',admLinks); }
      if(D.cls2Links){ cls2Links=JSON.parse(D.cls2Links); lsave('cls2_links',cls2Links); }
      if(D.user_tt0){ userTT[0]=JSON.parse(D.user_tt0); lsave('user_tt0',userTT[0]); }
      if(D.user_tt1){ userTT[1]=JSON.parse(D.user_tt1); lsave('user_tt1',userTT[1]); }
      if(D.todos){ todos=JSON.parse(D.todos); lsave('todos',todos); }
      if(D.title_cls){ lsave('title_cls',JSON.parse(D.title_cls)); }
      if(D.title_adm){ lsave('title_adm',JSON.parse(D.title_adm)); }
      if(D.title_cls2){ lsave('title_cls2',JSON.parse(D.title_cls2)); }
      applyTitles(); renderAll(); setSync('synced');
    })
    .catch(()=>setSync('error'));
}

/* ── 오버레이 ── */
function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id){document.getElementById(id).classList.remove('open');}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open')); });

function saveGsUrl(){
  const url = document.getElementById('gs-url-input').value.trim();
  if(!url){ GS_URL=''; try{localStorage.removeItem('gs_url');}catch(e){} closeOv('setup-ov'); setSync('local'); return; }
  setSync('syncing');
  document.getElementById('gs-url-input').disabled = true;
  fetch(url+'?action=getAll')
    .then(r=>r.json())
    .then(d=>{
      document.getElementById('gs-url-input').disabled = false;
      if(d && d.ok !== false){
        GS_URL = url;
        try{localStorage.setItem('gs_url', GS_URL);}catch(e){}
        closeOv('setup-ov');
        loadCloud();
      } else {
        setSync('error');
        alert('연결에 실패했어요. URL을 다시 확인해주세요.');
      }
    })
    .catch(()=>{
      document.getElementById('gs-url-input').disabled = false;
      setSync('error');
      alert('연결에 실패했어요. URL을 다시 확인해주세요.');
    });
}

/* ── 달력 ── */
function dateKey(yr,mo,d){
  return `${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function makeDots(key){
  const ev = scheduleMap[key];
  if(!ev) return '<div class="cal-dots"></div>';
  let dots = '';
  if(ev.g3)     dots += '<span class="cal-dot g3"></span>';
  if(ev.school) dots += '<span class="cal-dot school"></span>';
  return `<div class="cal-dots">${dots}</div>`;
}
function buildCal(){
  const today=new Date(), yr=calY, mo=calM;
  document.getElementById('cal-month').textContent=`${yr}.${String(mo+1).padStart(2,'0')}`;
  const fd=new Date(yr,mo,1).getDay(), ld=new Date(yr,mo+1,0).getDate(), pl=new Date(yr,mo,0).getDate();
  const DOWS=['일','월','화','수','목','금','토'];
  let h=DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<fd;i++){
    h+=`<div class="cal-day other${i===0?' sun':i===6?' sat':''}"><div>${pl-fd+1+i}</div><div class="cal-dots"></div></div>`;
  }
  for(let d=1;d<=ld;d++){
    const dw=(fd+d-1)%7;
    const isT=yr===today.getFullYear()&&mo===today.getMonth()&&d===today.getDate();
    const cls=['cal-day',isT?'today':'',dw===0?'sun':dw===6?'sat':''].filter(Boolean).join(' ');
    const key=dateKey(yr,mo,d);
    const hasEv = !!scheduleMap[key];
    const clickHandler = hasEv ? `onclick="window.open('https://chemistry12.github.io/0101/','_blank')"` : '';
    const cursorStyle = hasEv ? 'style="cursor:pointer"' : '';
    h+=`<div class="${cls}" data-key="${key}" ${cursorStyle} ${clickHandler} onmouseenter="showCalTip(this,event)" onmouseleave="hideCalTip()"><div>${d}</div>${makeDots(key)}</div>`;
  }
  const rem=42-fd-ld;
  for(let i=1;i<=rem;i++){
    const dw=(fd+ld-1+i)%7;
    h+=`<div class="cal-day other${dw===0?' sun':dw===6?' sat':''}"><div>${i}</div><div class="cal-dots"></div></div>`;
  }
  document.getElementById('cal-grid').innerHTML=h;
}

/* ── 달력 툴팁 ── */
let _tipEl = null;
function showCalTip(cell){
  const key = cell.dataset.key;
  if(!key) return;
  const ev = scheduleMap[key];
  if(!ev) return;
  hideCalTip();
  const [yr,mo,d] = key.split('-');
  const DOW=['일','월','화','수','목','금','토'][new Date(key).getDay()];
  let inner = `<div class="cal-tooltip-date">${parseInt(mo)}월 ${parseInt(d)}일 ${DOW}</div>`;
  if(ev.g3)     inner += `<div class="cal-tooltip-row cal-tooltip-g3"><span class="cal-tooltip-dot"></span><span class="cal-tooltip-txt">${escapeHtml(ev.g3)}</span></div>`;
  if(ev.school) inner += `<div class="cal-tooltip-row cal-tooltip-sch"><span class="cal-tooltip-dot"></span><span class="cal-tooltip-txt">${escapeHtml(ev.school)}</span></div>`;
  const tip = document.createElement('div');
  tip.className = 'cal-tooltip';
  tip.innerHTML = inner;
  const card = document.getElementById('cal-card');
  const cardRect = card.getBoundingClientRect();
  const cellRect = cell.getBoundingClientRect();
  let left = cellRect.left - cardRect.left - 8;
  let top  = cellRect.bottom - cardRect.top + 4;
  card.appendChild(tip);
  const tw = tip.offsetWidth;
  if(left + tw > card.offsetWidth - 8) left = card.offsetWidth - tw - 8;
  if(left < 4) left = 4;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
  _tipEl = tip;
}
function hideCalTip(){
  if(_tipEl){ _tipEl.remove(); _tipEl=null; }
}
function moveMonth(d){
  if(d===0){const t=new Date();calY=t.getFullYear();calM=t.getMonth();}
  else{calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}}
  buildCal();
}

/* ── 시간표 ── */
function merged(idx){
  const m={};
  Object.keys(TT_PRESET[idx]).forEach(k=>m[k]={...TT_PRESET[idx][k]});
  Object.keys(userTT[idx]).forEach(k=>{
    if(userTT[idx][k]===null)delete m[k];
    else m[k]={...(m[k]||{}),...userTT[idx][k]};
  });
  return m;
}
const PERIOD_TIMES=[
  {n:1,start:8*60+40,end:9*60+25},
  {n:2,start:9*60+40,end:10*60+25},
  {n:3,start:10*60+40,end:11*60+25},
  {n:4,start:12*60+30,end:13*60+15},
  {n:5,start:13*60+30,end:14*60+15},
  {n:6,start:14*60+30,end:15*60+15},
  {n:7,start:15*60+30,end:16*60+15},
];
function buildTT(idx){
  const now=new Date(), ti=now.getDay()-1, tt=merged(idx);
  const curTotal=now.getHours()*60+now.getMinutes();
  const nowPeriod = (ti>=0&&ti<5) ? (PERIOD_TIMES.find(p=>curTotal>=p.start&&curTotal<p.end)||null) : null;

  document.getElementById(`tt-head-${idx}`).innerHTML=
    '<tr><th class="p-head"></th>'+
    DAYS.map((d,i)=>`<th class="${i===ti?'th-today':''}">${d}</th>`).join('')+'</tr>';
  const body=document.getElementById(`tt-body-${idx}`);
  body.innerHTML='';
  PERIODS.forEach(({n,t})=>{
    const tr=document.createElement('tr');
    if(nowPeriod && nowPeriod.n===n) tr.classList.add('tt-row-now');
    tr.innerHTML=`<td class="p-col" title="${t}"><span>${n}</span></td>`;
    DAYS.forEach((d,di)=>{
      const key=`${d}-${n}`, cell=tt[key], td=document.createElement('td');
      if(di===ti)td.classList.add('t-col');
      if(cell){
        const c=ttColor(cell.color);
        // 주기율표 칸: 과목명 + 오른쪽 위 교실 번호, 그 아래 선생님
        const sub=cell.sub||'', m=sub.match(/\(?(\d{2,4})\)?/);
        const room=m?m[1]:'', rest=(m?sub.replace(m[0],''):sub).trim();
        td.innerHTML=`<div class="tt-cell" style="background:${c.bg};color:${c.text}" title="${escapeHtml(cell.subject+' '+sub)}" onclick="openTTEdit(${idx},'${d}',${n})">
          <span class="tt-cell-top"><span class="tt-cell-name">${escapeHtml(cell.subject)}</span>${room?`<span class="tt-cell-room">${room}</span>`:''}</span>
          ${rest?`<span class="tt-cell-sub">${escapeHtml(rest)}</span>`:''}
        </div>`;
      }else{
        td.innerHTML=`<div class="tt-cell empty" onclick="openTTEdit(${idx},'${d}',${n})"></div>`;
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}
function openTTEdit(idx,day,period){
  ttTarget={idx,day,period};
  const cell=merged(idx)[`${day}-${period}`]||{};
  document.getElementById('tt-ov-title').textContent=`${idx===0?'화학Ⅱ 반':'실험 반'} · ${day}요일 ${period}교시`;
  document.getElementById('tt-subj').value=cell.subject||'';
  document.getElementById('tt-color').value=cell.color||'yellow';
  document.getElementById('tt-room').value=cell.sub||'';
  document.getElementById('tt-del-btn').style.visibility=cell.subject?'visible':'hidden';
  openOv('tt-ov');
  setTimeout(()=>document.getElementById('tt-subj').focus(),80);
}
function saveTT(){
  if(!ttTarget)return;
  const key=`${ttTarget.day}-${ttTarget.period}`;
  const subj=document.getElementById('tt-subj').value.trim();
  userTT[ttTarget.idx][key]=subj
    ?{subject:subj,color:document.getElementById('tt-color').value,sub:document.getElementById('tt-room').value.trim()}
    :null;
  lsave('user_tt'+ttTarget.idx,userTT[ttTarget.idx]);
  syncData('user_tt'+ttTarget.idx, userTT[ttTarget.idx]);
  closeOv('tt-ov'); buildTT(ttTarget.idx);
}
function delTTCell(){
  if(!ttTarget)return;
  userTT[ttTarget.idx][`${ttTarget.day}-${ttTarget.period}`]=null;
  lsave('user_tt'+ttTarget.idx,userTT[ttTarget.idx]);
  syncData('user_tt'+ttTarget.idx, userTT[ttTarget.idx]);
  closeOv('tt-ov'); buildTT(ttTarget.idx);
}

/* ── 링크 섹션 제목 ── */
function saveTitle(type, val){
  lsave('title_'+type, val);
  syncData('title_'+type, val);
}
function applyTitles(){
  ['cls','adm','cls2'].forEach(t=>{
    const saved=lload('title_'+t, null);
    if(saved) document.getElementById('title-'+t).value=saved;
  });
}

/* ── 편집 모드 토글 ── */
const editModes = {cls:false, adm:false, cls2:false};
function setToggleLabel(type){
  const btn=document.getElementById('toggle-'+type);
  btn.classList.toggle('active', editModes[type]);
  btn.innerHTML = editModes[type] ? ic('check')+'완료' : ic('pencil')+'편집';
}
function toggleEditMode(type){
  editModes[type]=!editModes[type];
  setToggleLabel(type);
  renderLinks(type);
}

/* ── 색상 선택 ── */
let selectedColor = 'lc-gray';
function selectColor(el){
  document.querySelectorAll('.color-swatch').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}
function setColorPicker(color){
  selectedColor = color || 'lc-gray';
  document.querySelectorAll('.color-swatch').forEach(b=>{
    b.classList.toggle('selected', b.dataset.color===selectedColor);
  });
}

/* ── 링크 관리 ── */
function getList(type){return type==='cls'?clsLinks:type==='adm'?admLinks:cls2Links;}
function saveLinks(type){
  const list=getList(type);
  lsave(type+'_links',list);
  syncData(type+'Links', list);
}

let editLinkTarget = null;

function openAddLink(type){
  editLinkTarget = {type, idx: -1};
  document.getElementById('link-ov-title').textContent = '링크 추가';
  document.getElementById('edit-link-name').value = '';
  document.getElementById('edit-link-url').value = '';
  document.getElementById('link-del-btn').style.display = 'none';
  setColorPicker('lc-gray');
  openOv('link-edit-ov');
  setTimeout(()=>document.getElementById('edit-link-name').focus(),80);
}
function openEditLink(type, idx){
  const link = getList(type)[idx];
  editLinkTarget = {type, idx};
  document.getElementById('link-ov-title').textContent = '링크 수정';
  document.getElementById('edit-link-name').value = link.name;
  document.getElementById('edit-link-url').value = link.url;
  document.getElementById('link-del-btn').style.display = '';
  setColorPicker(link.color||'lc-gray');
  openOv('link-edit-ov');
  setTimeout(()=>document.getElementById('edit-link-name').focus(),80);
}
function saveEditLink(){
  if(!editLinkTarget)return;
  const {type, idx} = editLinkTarget;
  let url = document.getElementById('edit-link-url').value.trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  const name = document.getElementById('edit-link-name').value.trim() || (()=>{try{return new URL(url).hostname.replace('www.','');}catch{return url;}})();
  const item = {url, name, color: selectedColor};
  if(idx===-1){ getList(type).push(item); }
  else { getList(type)[idx]=item; }
  saveLinks(type); renderLinks(type);
  closeOv('link-edit-ov');
}
function deleteEditLink(){
  if(!editLinkTarget||editLinkTarget.idx===-1)return;
  const {type,idx}=editLinkTarget;
  getList(type).splice(idx,1);
  saveLinks(type); renderLinks(type);
  closeOv('link-edit-ov');
}

function renderLinks(type){
  const list = getList(type);
  const el = document.getElementById(type+'-list');
  const isEdit = editModes[type];
  el.className = 'link-btn-grid' + (isEdit ? ' edit-mode' : '');

  let html = '';
  list.forEach((l,i)=>{
    const color = l.color||'lc-gray';
    const safeUrl = encodeURIComponent(l.url);
    html += `<div class="link-item" draggable="${isEdit}" data-type="${type}" data-idx="${i}"
      ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="dragDrop(event)"
      ondragend="dragEnd(event)">
      ${isEdit ? `<div class="drag-handle">${ic('grip')}</div>` : ''}
      <button class="link-btn ${color}"
        onclick="${isEdit ? '' : `window.open(decodeURIComponent('${safeUrl}'),'_blank','noopener')`}"
        title="${escapeHtml(l.url)}"><span class="link-dot"></span><span class="link-btn-label">${escapeHtml(l.name)}</span></button>
      <div class="link-item-actions">
        <button class="link-item-act" onclick="openEditLink('${type}',${i})">${ic('pencil')}수정</button>
        <button class="link-item-act del" onclick="quickDelLink('${type}',${i})">${ic('trash')}삭제</button>
      </div>
    </div>`;
  });

  if(isEdit || list.length === 0){
    html += `<button class="link-add-btn" onclick="openAddLink('${type}')">${ic('plus')}추가</button>`;
  }

  el.innerHTML = html;
}

/* ── 드래그 앤 드롭 ── */
let dragSrcType = null, dragSrcIdx = null;

function dragStart(e){
  const el = e.currentTarget;
  dragSrcType = el.dataset.type;
  dragSrcIdx  = parseInt(el.dataset.idx);
  e.dataTransfer.effectAllowed = 'move';
  el.classList.add('dragging');
}
function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  if(el.dataset.idx !== undefined) el.classList.add('drag-over');
}
function dragDrop(e){
  e.preventDefault();
  const target = e.currentTarget;
  const toIdx = parseInt(target.dataset.idx);
  if(dragSrcType && dragSrcIdx !== null && dragSrcIdx !== toIdx && dragSrcType === target.dataset.type){
    const list = getList(dragSrcType);
    const [moved] = list.splice(dragSrcIdx, 1);
    list.splice(toIdx, 0, moved);
    saveLinks(dragSrcType);
    renderLinks(dragSrcType);
  }
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function dragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  dragSrcType = null; dragSrcIdx = null;
}

function quickDelLink(type,idx){
  getList(type).splice(idx,1);
  saveLinks(type); renderLinks(type);
}

/* ── 할 일 ── */
function addTodo(){
  const input=document.getElementById('todo-input');
  const dueInput=document.getElementById('todo-due-input');
  const text=input.value.trim();
  if(!text)return;
  todos.push({text, done:false, id:Date.now(), due: dueInput.value||null});
  input.value=''; dueInput.value='';
  saveTodos(); renderTodos();
}
function toggleTodo(id){
  const t=todos.find(x=>x.id===id);
  if(t)t.done=!t.done;
  saveTodos(); renderTodos();
}
function delTodo(id){
  todos=todos.filter(x=>x.id!==id);
  saveTodos(); renderTodos();
}
function startEditTodo(id){
  const t=todos.find(x=>x.id===id);
  if(!t)return;
  const el=document.getElementById(`todo-text-${id}`);
  if(!el)return;
  const inp=document.createElement('input');
  inp.className='todo-text-edit';
  inp.value=t.text;
  el.replaceWith(inp);
  inp.focus(); inp.select();
  const finish=()=>{
    const v=inp.value.trim();
    if(v){ t.text=v; saveTodos(); }
    renderTodos();
  };
  inp.addEventListener('blur', finish);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){renderTodos();} });
}
function clearDoneTodos(){
  todos=todos.filter(x=>!x.done);
  saveTodos(); renderTodos();
}
function saveTodos(){
  lsave('todos',todos);
  syncData('todos',todos);
}
function getDueLabel(due){
  if(!due) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(due); d.setHours(0,0,0,0);
  const diff=Math.round((d-today)/(1000*60*60*24));
  if(diff<0)  return {cls:'due-over', txt:`D+${Math.abs(diff)}`};
  if(diff===0)return {cls:'due-soon', txt:'D-Day'};
  if(diff<=3) return {cls:'due-soon', txt:`D-${diff}`};
  return {cls:'due-ok', txt:`D-${diff}`};
}
function renderTodos(){
  const el=document.getElementById('todo-list');
  const cnt=document.getElementById('todo-count');
  if(!todos.length){el.innerHTML='<div class="empty-msg">할 일이 없습니다</div>';cnt.textContent='항목 없음';return;}
  const done=todos.filter(x=>x.done).length;
  cnt.textContent=`${done}/${todos.length} 완료`;
  const sorted=[...todos.filter(x=>!x.done),...todos.filter(x=>x.done)];
  el.innerHTML=sorted.map(t=>{
    const due=getDueLabel(t.due);
    return `
    <div class="todo-item${t.done?' done':''}" id="todo-${t.id}">
      <button class="todo-check" onclick="toggleTodo(${t.id})" aria-label="완료 표시">${ic('check')}</button>
      <span class="todo-text" id="todo-text-${t.id}">${escapeHtml(t.text)}</span>
      ${due?`<span class="todo-due ${due.cls}">${due.txt}</span>`:''}
      <div class="todo-actions">
        <button class="todo-act" onclick="startEditTodo(${t.id})" title="수정">${ic('pencil')}</button>
        <button class="todo-act del" onclick="delTodo(${t.id})" title="삭제">${ic('x')}</button>
      </div>
    </div>`;
  }).join('');
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── 전체 렌더 ── */
function renderAll(){
  renderLinks('cls'); renderLinks('adm'); renderLinks('cls2');
  renderTodos(); buildCal(); buildTT(0); buildTT(1);
}

function init(){
  const now=new Date(); calY=now.getFullYear(); calM=now.getMonth();
  clsLinks = lload('cls_links',[]);

  cls2Links= lload('cls2_links',[]);

  renderAll();
  if(GS_URL)loadCloud(); else setSync('local');
  setInterval(()=>{ buildTT(0); buildTT(1); }, 60000);
  loadSchedule();
}
init();
